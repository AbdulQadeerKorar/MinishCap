name: Build Minish Cap APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q MinishCap.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch mGBA libretro cores
        working-directory: MinishCapGBA
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            curl -fL -o core_$abi.zip "https://buildbot.libretro.com/nightly/android/latest/$abi/mgba_libretro_android.so.zip"
            unzip -o core_$abi.zip -d tmp_$abi
            mv tmp_$abi/mgba_libretro_android.so app/src/main/jniLibs/$abi/libmgba_libretro_android.so
          done
      - name: Build
        working-directory: MinishCapGBA
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MinishCap-apk
          path: MinishCapGBA/app/build/outputs/apk/debug/app-debug.apk
